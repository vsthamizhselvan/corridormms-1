[package]
name = "corridorkey-desktop"
version = "2.0.0"
description = "CorridorKey 2.0 Professional AI Video Keying & Rotoscoping Desktop Application"
authors = ["CorridorKey Desktop Architecture Team"]
edition = "2021"

[lib]
name = "corridorkey_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
sysinfo = "0.30"
uuid = { version = "1.0", features = ["v4"] }
